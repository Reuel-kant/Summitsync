<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SummitSync | Guest Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; }
    @media screen { .print-only { display: none !important; } }
    @media print {
      @page { size: A4; margin: 0; }
      body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      #root,#root>div,main,body,html { padding:0!important;margin:0!important;max-width:none!important;display:block!important;height:auto!important;min-height:0!important;overflow:visible!important;background:white!important; }
    }
    .a4-page{width:210mm;height:297mm;margin:0 auto;page-break-after:always;display:grid!important;justify-content:center;align-content:start;padding:10mm 5mm;box-sizing:border-box;gap:0;background:white}
    .grid-cr80{grid-template-columns:repeat(2,85.6mm);grid-template-rows:repeat(5,53.98mm)}
    .grid-large{grid-template-columns:repeat(2,101.6mm);grid-template-rows:repeat(1,152.4mm);padding-top:50mm}
    .print-card-container{position:relative;overflow:hidden;box-sizing:border-box;border:0.05mm solid #eee}
    .cr80-box{width:85.6mm;height:53.98mm} .large-box{width:101.6mm;height:152.4mm}
    .scanner-video-container video{border-radius:1.5rem;object-fit:cover}
    ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-track{background:#020617}
    ::-webkit-scrollbar-thumb{background:#1e293b;border-radius:10px} ::-webkit-scrollbar-thumb:hover{background:#334155}
    .no-scrollbar::-webkit-scrollbar{display:none} .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://aistudiocdn.com/react@^19.2.0",
      "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
      "react/": "https://aistudiocdn.com/react@^19.2.0/",
      "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
      "qrcode.react": "https://aistudiocdn.com/qrcode.react@^4.2.0",
      "@google/genai": "https://esm.run/@google/genai",
      "@supabase/supabase-js": "https://esm.run/@supabase/supabase-js@2",
      "html-to-image": "https://esm.run/html-to-image",
      "@emailjs/browser": "https://esm.run/@emailjs/browser"
    }
  }
  </script>
  <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-500">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
